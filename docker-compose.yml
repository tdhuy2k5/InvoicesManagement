services:
  # ==============================================================================
  # PostgreSQL Database Service
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: invoicemanagement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: invoicedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoicedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - invoice_network

  # ==============================================================================
  # Backend Express REST API Service
  # ==============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: invoicemanagement_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/invoicedb?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - invoice_network

  # ==============================================================================
  # Web Application (React SPA + Nginx Reverse Proxy)
  # ==============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoicemanagement_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - api
    networks:
      - invoice_network

volumes:
  pgdata:
    name: invoicemanagement_pgdata

networks:
  invoice_network:
    name: invoicemanagement_network
