$kind: http-request
name: 2.2 Replace Invoice (ISSUED -> REPLACED)
url: "{{baseUrl}}/api/invoices/{{invoiceId}}/replace"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "customerName": "Công ty Cổ phần Thương mại Alpha (Thay Thế)",
      "customerTaxCode": "0108888888",
      "customerEmail": "alpha@example.com",
      "customerAddress": "Tầng 8, Tòa nhà Landmark 72, Cầu Giấy, Hà Nội",
      "sellerName": "Công ty Cổ phần Giải pháp Phần mềm TechVN",
      "sellerTaxCode": "0309876543",
      "sellerAddress": "Số 123 Đường Nguyễn Huệ, Quận 1, TP. Hồ Chí Minh",
      "sellerPhone": "0901234567",
      "vatRate": 10,
      "agreementMinutes": "01/BB-TT",
      "notes": "Hóa đơn thay thế do sai sót đơn giá",
      "items": [
        {
          "description": "Phần mềm quản lý hóa đơn (Gói Doanh Nghiệp Chuẩn)",
          "unit": "Gói",
          "quantity": 1,
          "unitPrice": 16000000
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.success && jsonData.data && jsonData.data.id) {
          pm.collectionVariables.set('invoiceId', jsonData.data.id);
          console.log('Updated invoiceId to replacement:', jsonData.data.id);
      }
    language: text/javascript
order: 2000
